server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ukuran maksimum unggahan; batas sebenarnya tetap divalidasi backend.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Aset ber-hash dari Vite aman di-cache lama karena namanya berubah
    # setiap kali isinya berubah.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker tidak boleh di-cache, agar pembaruan PWA langsung terpakai.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
        try_files $uri =404;
    }

    # SPA fallback: semua rute ditangani React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Sembunyikan versi nginx dari response header.
    server_tokens off;
}
