name: Deploy Frontend Production

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Frontend to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -e

            echo "🚀 Starting frontend deployment..."

            cd /opt/siaga-kota/frontend

            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            # Variabel VITE_* di-inline saat build, sehingga .env wajib ada
            # sebelum image dibangun.
            if [ ! -f .env ]; then
              echo "❌ .env tidak ditemukan di /opt/siaga-kota/frontend"
              exit 1
            fi

            echo "🐳 Building frontend image..."
            docker compose -f compose.prod.yml build

            echo "⏹️ Stopping old container..."
            docker compose -f compose.prod.yml down

            echo "▶️ Starting new container..."
            docker compose -f compose.prod.yml up -d

            FRONTEND_PORT=$(grep -E '^FRONTEND_PORT=' .env | cut -d '=' -f2 | tr -d '"' | tr -d "'")
            FRONTEND_PORT=${FRONTEND_PORT:-25173}

            echo "⏳ Waiting for frontend to be healthy on port ${FRONTEND_PORT}..."
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${FRONTEND_PORT}/" > /dev/null 2>&1; then
                echo "✅ Frontend healthy on 127.0.0.1:${FRONTEND_PORT}"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "❌ Frontend failed health check"
                docker compose -f compose.prod.yml logs --tail=50 frontend
                exit 1
              fi
              sleep 2
            done

            echo "🧹 Pruning dangling images..."
            docker image prune -f

            echo "✅ Frontend deployment completed!"

            docker compose -f compose.prod.yml ps

            docker compose -f compose.prod.yml logs --tail=20 frontend

      - name: Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Frontend Deployment SUCCESS"
          else
            echo "❌ Frontend Deployment FAILED"
          fi
