services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: siagakota-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      - APP_ENV=production
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - siagakota
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 3s
      retries: 3

  pgsql:
    image: postgis/postgis:16-3.4-alpine
    container_name: siagakota-pgsql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-siagakota_prod}
      POSTGRES_USER: ${DB_USERNAME:-siagakota}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    networks:
      - siagakota
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME:-siagakota}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: siagakota-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - siagakota
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  horizon:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: siagakota-horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
    depends_on:
      - pgsql
      - redis
    networks:
      - siagakota

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: siagakota-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
    depends_on:
      - pgsql
      - redis
    networks:
      - siagakota

networks:
  siagakota:
    driver: bridge

volumes:
  pgsql-data:
    driver: local
  redis-data:
    driver: local