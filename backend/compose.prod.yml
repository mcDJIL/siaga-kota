services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: siagakota-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env 
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - siagakota
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 3s
      retries: 3

  pgsql:
    image: postgis/postgis:16-3.4-alpine
    container_name: siagakota-pgsql
    restart: unless-stopped
    ports:
      - "0.0.0.0:15432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    networks:
      - siagakota
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME:-siagakota}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: siagakota-redis
    restart: unless-stopped
    # Tidak dipublikasikan ke host. Diakses antar container lewat
    # nama service/container pada network siagakota.
    expose:
      - "6379"
    env_file:
      - .env 
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - siagakota
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  horizon:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: siagakota-horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    stop_grace_period: 60s
    volumes:
      - ./storage:/var/www/html/storage
    env_file:
      - .env
    environment:
      - APP_ENV=production
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - siagakota
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: siagakota-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./storage:/var/www/html/storage
    env_file:
      - .env
    environment:
      - APP_ENV=production
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - siagakota

  reverb:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: siagakota-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    stop_grace_period: 30s
    volumes:
      - ./storage:/var/www/html/storage
    env_file:
      - .env
    ports:
      - "127.0.0.1:${REVERB_SERVER_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - siagakota

networks:
  siagakota:
    driver: bridge

volumes:
  pgsql-data:
    driver: local
  redis-data:
    driver: local