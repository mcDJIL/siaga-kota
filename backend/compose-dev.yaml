services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.dev
        ports:
            - '8000:8000'
        env_file:
            - .env
        volumes:
            - '.:/var/www/html'
        working_dir: /var/www/html
        command: php artisan serve --host=0.0.0.0 --port=8000
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - siagakota
    worker:
        build:
            context: .
            dockerfile: Dockerfile.dev
        env_file:
            - .env
        volumes:
            - '.:/var/www/html'
        working_dir: /var/www/html
        command: php artisan queue:work redis --tries=3 --backoff=10 --max-time=3600
        restart: unless-stopped
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - siagakota
    scheduler:
        build:
            context: .
            dockerfile: Dockerfile.dev
        env_file:
            - .env
        volumes:
            - '.:/var/www/html'
        working_dir: /var/www/html
        command: php artisan schedule:work
        restart: unless-stopped
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - siagakota
    reverb:
        build:
            context: .
            dockerfile: Dockerfile.dev
        ports:
            - '${REVERB_SERVER_PORT}:8080'
        env_file:
            - .env
        volumes:
            - '.:/var/www/html'
        working_dir: /var/www/html
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        restart: unless-stopped
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - siagakota
    pgsql:
        image: 'postgis/postgis:16-3.4-alpine'
        ports:
            - '${DB_PORT}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'pgsql-data:/var/lib/postgresql/data'
        networks:
            - siagakota
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${REDIS_PORT}:6379'
        volumes:
            - 'redis-data:/data'
        networks:
            - siagakota
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    siagakota:
        driver: bridge
volumes:
    pgsql-data:
        driver: local
    redis-data:
        driver: local
